name: Compiler APK KUMBA CAST

on:
  workflow_dispatch:
  push:
    paths:
      - "le-prix-de-la-foi-corrige.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    name: Compiler l'application Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle compatible
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Extraire le projet
        shell: bash
        run: |
          set -e
          mkdir -p projet
          unzip -o le-prix-de-la-foi-corrige.zip -d projet
          echo "Fichiers Gradle trouvés :"
          find projet -type f \( -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts \)

      - name: Repérer le projet Android
        shell: bash
        run: |
          set -e
          ROOT="$(find projet -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$ROOT" ]; then
            echo "ERREUR : aucun fichier settings.gradle trouvé dans le ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$ROOT")" >> "$GITHUB_ENV"
          echo "Projet Gradle trouvé dans : $(dirname "$ROOT")"

      - name: Compiler APK debug
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Publier le fichier APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KUMBA-CAST-LE-PRIX-DE-LA-FOI-APK
          path: projet/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
